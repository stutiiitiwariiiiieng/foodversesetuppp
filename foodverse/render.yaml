# Render Blueprint: backend as a Docker web service
services:
  - type: web
    name: foodverse-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste in the Render dashboard
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://foodverse.vercel.app
